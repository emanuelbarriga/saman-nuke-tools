# openspec/config.yaml — SDD configuration for saman-nuke-tools
# Generated by sdd-init (2026-09-02). Mode: openspec.

schema: spec-driven

context: |
  Tech stack: Nuke 17.x plugin toolkit (PySide6 Qt widgets, OCIO, .gizmo/.nk assets),
  Python 3.14 dev env. Deployed to ~/.nuke/SamanTools via git (bootstrap: menu.py).
  Architecture: SamanTools/ module plugin pattern; bootstrap menu.py + bootstrap/menu.py;
  see docs/ARQUITECTURA.md (historical errors, operational rules).
  Testing: pytest 9 + nuke stub in tests/conftest.py; run from repo root, no pytest config files.
  Style: docstrings in Spanish, identifiers in English, conventional commits,
  SemVer via SamanTools/__init__.py __version__ (VERSIONING.md).

rules:
  proposal:
    - Repo is PUBLIC: never include secrets, tokens, personal absolute paths, or config_local.py content.
    - Do not touch legacy install.sh/install.bat; installer flow is instalar_script_editor.py + bootstrap/menu.py.
  specs:
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Scenarios describe observable behavior in the existing test style (plain asserts via the nuke stub).
    - Do not reintroduce historical errors from docs/ARQUITECTURA.md (nuke.Undo() without args,
      pluginAddPath without kwargs, dynamic [python ...] knob resolution, removed RutaActual knob).
  design:
    - Document architecture decisions with rationale.
    - Respect the update model: artist consent, git fetch only, pull --ff-only.
    - OCIO color space ids: technical id first (partes[0]), visible label last (partes[-1]).
  tasks:
    - Group by phase, use hierarchical numbering.
    - Keep tasks completable in one session; every change keeps the suite green.
  apply:
    guidelines:
      - Follow existing SamanTools/ module patterns (stdlib-only for entorno.py and limpiar.py).
      - Docstrings in Spanish, identifiers in English.
      - Validate python3 -m py_compile on every touched .py before commit.
    tdd: true
    test_command: "python3 -m pytest"
  verify:
    test_command: "python3 -m pytest"
    build_command: "python3 -m py_compile {touched_py_files}"
    coverage_threshold: 0
    coverage_notes: "Report real coverage only; verificar_salud.py reports per-run numbers, never fake them."
  archive:
    - Warn before merging destructive deltas.

